name: tool-policy-lab
on:
  push:
    branches: [feat/tool-policy-lab]
    paths: ['examples/tool_policy_lab/**', '.github/workflows/tool-policy-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/tool_policy_lab/requirements-cpu.txt
      - run: python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r examples/tool_policy_lab/requirements-cpu.txt
      - run: python -m pytest examples/tool_policy_lab/tests -q
        env:
          PYTHONPATH: trainer/src:worker/src:examples/tool_policy_lab
