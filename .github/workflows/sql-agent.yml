name: sql-agent-contracts
on:
  push:
    branches: [feat/tool-policy-lab]
    paths: ['examples/sql_agent_rl/**', '.github/workflows/sql-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r examples/sql_agent_rl/requirements.txt
      - run: python -m pytest examples/sql_agent_rl/tests -q
        env:
          PYTHONPATH: trainer/src:worker/src:examples/sql_agent_rl
